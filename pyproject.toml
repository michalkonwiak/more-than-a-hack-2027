[project]
name = "mtah-possession"
version = "0.1.0"
description = "Reproducible temporal possession inference for More Than a Hack 2027"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["possession/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"possession/review.py" = ["E501"]
